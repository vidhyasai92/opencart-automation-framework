name: Selenium Test Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
      
    - name: Install Firefox
      uses: browser-actions/setup-firefox@latest
      
    - name: Build with Maven
      run: mvn clean compile
      
    - name: Run Tests
      run: mvn test -Dbrowser=chrome
      continue-on-error: true
      
    - name: Generate Test Report
      if: always()
      run: |
        echo "Test execution completed"
        ls -la test-output/ || echo "No test-output directory"
        ls -la reports/ || echo "No reports directory"
        
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: |
          test-output/
          reports/
          screenshots/
        retention-days: 30
        
    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: failure-screenshots
        path: screenshots/
        retention-days: 30
        
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Browser: Chrome" >> $GITHUB_STEP_SUMMARY
        echo "- OS: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY
        echo "- Java Version: 11" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY
